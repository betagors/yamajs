# yaml-language-server: $schema=../../packages/cli/src/yama.schema.json
project:
  name: blog-api
  version: 1.0.0

plugins:
  - "@yamajs/pglite"

# ============================================================================
# ENTITIES: Database definitions
# ============================================================================
entities:
  Author:
    database: authors
    fields:
      id: uuid!
      name: string!
      email: string! unique
      bio: text?
      createdAt: timestamp = now
      updatedAt: timestamp = now

  Post:
    database:
      table: posts
      indexes:
        - fields: [authorId, publishedAt]
        - fields: [published]
    fields:
      id: uuid!
      title: string! indexed
      content: text!
      excerpt: string?
      published: boolean = false
      publishedAt: timestamp?
      author: Author! cascade
      createdAt: timestamp = now
      updatedAt: timestamp = now

  Comment:
    database:
      table: comments
      indexes:
        - fields: [postId]
        - fields: [postId, authorEmail]
          unique: true
    fields:
      id: uuid!
      content: text!
      authorName: string!
      authorEmail: string!
      post: Post! cascade
      createdAt: timestamp = now
      updatedAt: timestamp = now

# ============================================================================
# SCHEMAS: API views/DTOs
# ============================================================================
schemas:
  PostSummary:
    source: Post
    fields:
      id: uuid!
      title: string!
      excerpt: string?
      published: boolean!
      authorName: string!
    computed:
      authorName: "{{author.name}}"

  PostDetail:
    source: Post
    fields:
      id: uuid!
      title: string!
      content: string!
      excerpt: string?
      published: boolean!
      publishedAt: timestamp?
      author: Author!
      createdAt: timestamp!
      updatedAt: timestamp!

  AuthorWithPosts:
    source: Author
    fields:
      id: uuid!
      name: string!
      email: string!
      bio: string?
      posts: PostSummary[]

# ============================================================================
# OPERATIONS: Business logic definitions
# ============================================================================
operations:
  # Posts - Standard CRUD
  listPosts:
    output: PostSummary[]
    rest: true
    graphql: true
    policy: public

  getPost:
    output: PostDetail
    rest: true
    graphql: true
    policy: public

  createPost:
    output: Post
    rest: true
    graphql: true
    policy: author

  updatePost:
    output: Post
    rest: true
    graphql: true
    policy: author

  deletePost:
    rest:
      visibility: admin
    policy: admin

  # Posts - Custom operations
  searchPosts:
    input:
      q: string!
      published: boolean?
      limit: number = 20
      offset: number = 0
    output: PostSummary[]
    rest:
      method: GET
      path: /posts/search
    graphql: true
    policy: public

  listPublishedPosts:
    output: PostSummary[]
    filter:
      published: true
    rest:
      method: GET
      path: /posts/published
    graphql: true
    policy: public

  publishPost:
    input:
      id: uuid!
    output: Post
    handler: src/handlers/publishPost.ts
    rest:
      method: POST
      path: /posts/:id/publish
    policy: author

  unpublishPost:
    input:
      id: uuid!
    output: Post
    handler: src/handlers/unpublishPost.ts
    rest:
      method: POST
      path: /posts/:id/unpublish
    policy: author

  # Authors
  listAuthors:
    output: Author[]
    rest: true
    policy: public

  getAuthor:
    output: AuthorWithPosts
    rest: true
    policy: public

  createAuthor:
    output: Author
    rest: true
    policy: admin

  updateAuthor:
    output: Author
    rest: true
    policy: author

  # Comments - Nested under Post
  listComments:
    parent: Post
    output: Comment[]
    rest: true
    policy: public

  getComment:
    parent: Post
    output: Comment
    rest: true
    policy: public

  createComment:
    parent: Post
    input:
      content: string!
      authorName: string!
      authorEmail: string!
    output: Comment
    rest: true
    policy: authenticated

  deleteComment:
    parent: Post
    rest:
      visibility: admin
    policy: admin

  # Author posts (nested)
  listAuthorPosts:
    parent: Author
    output: PostSummary[]
    rest: true
    policy: public

# ============================================================================
# POLICIES: Reusable access control
# ============================================================================
policies:
  public:
    auth: false

  authenticated:
    auth: true

  author:
    auth:
      required: true
      roles: [author, admin]

  admin:
    auth:
      required: true
      roles: [admin]

# ============================================================================
# RATE LIMITS
# ============================================================================
rateLimits:
  default:
    window: 15m
    max: 100
  operations:
    createPost:
      window: 1h
      max: 10
    createComment:
      window: 1h
      max: 20

# ============================================================================
# CACHE
# ============================================================================
cache:
  default:
    ttl: 5m
  operations:
    listPosts:
      ttl: 1m
      invalidateOn: [createPost, updatePost, deletePost, publishPost]
    getPost:
      ttl: 5m
      key: "post:{id}"
      invalidateOn: [updatePost, deletePost, publishPost]
    listPublishedPosts:
      ttl: 2m
      invalidateOn: [publishPost, unpublishPost]
